# Оркестратор: пороги эскалации, управление контекстом, elder-режим

services:
  rag: http://rag-service:8093
  llm_gateway: http://llm-gateway:8094
  audit_worker: http://audit-worker:8096

llm:
  model_alias: caller            # gateway маршрутизирует по своему списку провайдеров

session:
  context:
    max_tokens: 32768          # потолок на сессию (не на запрос)
    system_prompt_max_tokens: 500
    rag_block_max_tokens: 4096
    history_reserve_tokens: 2048
    keep_last_turns_verbatim: 6
    summary_max_tokens: 200
    topic_similarity_threshold: 0.82   # cos(query, active_topic_query)

stt:
  min_confidence: 0.60
  empty_text_max_clarify: 2        # пустой текст → максимум 2 переспроса

clarification:
  max_attempts_default: 2
  max_attempts_elder: 5            # нераспознанная/невнятная речь (пожилые)
  ask_before_rag: true             # уточняющий вопрос ДО RAG-поиска

simple_explain:
  max_per_question: 3              # счётчик «объясни проще»

rag:
  min_rerank_score: 0.30           # ниже → эскалация (no match)
  top_n_vector: 20
  top_n_final: 4

llm:
  min_confidence: 0.70             # ниже → эскалация (не «додумывать»)
  max_retries_invalid: 1           # retry при невалидном JSON/цитате
  timeout_seconds: 15

citation:
  validate: true                   # программа валидирует номера статей
  retry_on_invalid: 1              # retry с исправляющим промптом

escalation:
  queue: OPERATOR_QUEUE
  announce_phrase: "Соединяю вас с оператором, одно мгновение"
  policy_dispute_keywords:         # детерминированный фильтр ДО RAG/LLM
    - "доначислен"
    - "претензия"
    - "обжалу"
    - "споров"
    - "штраф выписали"
    - "не согласен с решением"

elder_mode:
  auto_enable:
    consecutive_low_confidence: 2
    low_confidence_threshold: 0.65
    long_pause_seconds: 4
  tts_speed: 0.9

fillers:
  ru:
    - "Одно мгновение, я уточняю в справочнике."
    - "Спасибо, проверяю норму кодекса."
  kk:
    - "Сәт сәт, нұсқаулықтан тексеріп жатырмын."
    - "Рахмет, кодексті нормасын тексеріп жатырмын."

audit:
  async_queue: true
  dead_letter_retries: 3
