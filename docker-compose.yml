# Голосовой AI-ассистент НК РК — docker-compose скелет
# Asterisk/FreePBX остаётся вне docker (systemd, уже развёрнут).
# Запуск: docker compose up -d (после копирования моделей и заполнения .env)

services:

  media-gateway:
    build: ./services/media_gateway
    image: aitaxassistent/media-gateway:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"   # ExternalMedia WS для Asterisk (на хосте); только localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"   # доступ к Asterisk ARI на хосте
    environment:
      - CONFIG_FILE=/etc/aitaxassistent/media-gateway.yaml
      - ARI_USER=${ARI_USER}
      - ARI_PASSWORD=${ARI_PASSWORD}
    volumes:
      - ./config/media-gateway.yaml:/etc/aitaxassistent/media-gateway.yaml:ro
      - ./models:/models:ro
    deploy:
      resources:
        limits: { cpus: "2", memory: 768M }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  stt:
    build: ./services/stt
    image: aitaxassistent/stt:latest
    restart: unless-stopped
    environment:
      - MODEL_PATH=/models/whisper/whisper-large-v3-turbo-FT-kzru
      - COMPUTE_TYPE=int8_float16
      - BEAM_SIZE=5
      - DEVICE=cuda
    volumes:
      - ./models/whisper:/models/whisper:ro
      - ./config/stt.yaml:/etc/aitaxassistent/stt.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits: { memory: 4G }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8091/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  orchestrator:
    build: ./services/orchestrator
    image: aitaxassistent/orchestrator:latest
    restart: unless-stopped
    environment:
      - CONFIG_FILE=/etc/aitaxassistent/orchestrator.yaml
    volumes:
      - ./config/orchestrator.yaml:/etc/aitaxassistent/orchestrator.yaml:ro
    depends_on:
      - rag-service
      - llm-gateway
      - tts
      - audit-db
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  rag-service:
    build: ./services/rag_service
    image: aitaxassistent/rag-service:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:8093"   # только локально — для indexer'а и проверок
    environment:
      - CONFIG_FILE=/etc/aitaxassistent/rag.yaml
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - ./models/bge-m3:/models/bge-m3:ro
      - ./models/reranker:/models/reranker:ro
      - ./config/rag.yaml:/etc/aitaxassistent/rag.yaml:ro
    deploy:
      resources:
        limits: { cpus: "4", memory: 9G }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8093/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # только локально — для indexer'а
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits: { cpus: "1", memory: 2G }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  llm-gateway:
    build: ./services/llm_gateway
    image: aitaxassistent/llm-gateway:latest
    restart: unless-stopped
    environment:
      - CONFIG_FILE=/etc/aitaxassistent/llm-gateway.yaml
    volumes:
      - ./config/llm-gateway.yaml:/etc/aitaxassistent/llm-gateway.yaml:ro
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8094/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  tts:
    build: ./services/tts
    image: aitaxassistent/tts:latest
    restart: unless-stopped
    environment:
      - MODELS_DIR=/models/piper
      - CONFIG_FILE=/etc/aitaxassistent/tts.yaml
    volumes:
      - ./models/piper:/models/piper:ro
      - ./config/tts.yaml:/etc/aitaxassistent/tts.yaml:ro
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8095/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  audit-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=audit
      - POSTGRES_USER=aitaxassistent
      - POSTGRES_PASSWORD=${AUDIT_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"   # только локально — для indexer'а и проверок
    volumes:
      - audit_db_data:/var/lib/postgresql/data
      - ./audit/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitaxassistent -d audit"]
      interval: 10s
      timeout: 3s
      retries: 5

  audit-worker:
    build: ./services/audit_worker
    image: aitaxassistent/audit-worker:latest
    restart: unless-stopped
    environment:
      - AUDIT_DB_URL=postgresql://aitaxassistent:${AUDIT_DB_PASSWORD}@audit-db:5432/audit
      - INGEST_PORT=8096
    depends_on:
      audit-db:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1", memory: 256M }

volumes:
  qdrant_storage:
  audit_db_data:

networks:
  default:
    name: aitaxassistent_net
