; Dialplan для FreePBX: голосовой AI-ассистент НК РК
;
; 1. Создать Extension or Feature "ai-assist" (входящий номер для консультаций)
; 2. Создать контекст отключения на оператора:
;    - Custom Context: from-ai-escalation
;    - Extension: OPERATOR_QUEUE -> Dial(SIP/AGENT1|SIP/AGENT2,60)
;      (замените на свою очередь/агентов)
; 3. ExternalMedia должен ходить на media-gateway:
;    - порт 8081 проброшен docker-compose на 127.0.0.1 (см. docker-compose.yml,
;      раздел ports сервиса media-gateway), Asterisk на том же хосте стучится
;      на ws://127.0.0.1:8081
;
; ВАЖНО: ExternalMedia должен быть ДО Dial() — AI отвечает первым.
; Параметр ?caller=${CALLERID(num)} передаёт номер абонента в media-gateway
; (далее маскируется в audit как caller_masked). НЕ перезаписывайте CALLERID —
; оператор должен видеть реальный номер при эскалации.

[ai-assistant]
exten => ai-assist,1,NoOp(Inbound AI tax consultation)
 same => n,Answer()
 same => n,Set(TIMEOUT(readonly)=300)
 same => n,ExternalMedia(${EXTEN},ws://127.0.0.1:8081/stream/${UNIQUEID}?caller=${CALLERID(num)},linear8)
; ExternalMedia возвращается, когда WS закрыт (команда orchestrator "transfer"
; или обрыв) — в любом случае переводим на оператора. Если абонент уже повесил
; трубку, канал завершён и Dial просто не дозвонится.
 same => n(ai-escalate),NoOp(ExternalMedia ended/failed -> operator)
 same => n,Dial(SIP/OPERATOR_QUEUE,90)
 same => n,Hangup()

; Контекст эскалации (используется, когда ExternalMedia WS закрыт
; по команде orchestrator "transfer")
[from-ai-escalation]
exten => OPERATOR_QUEUE,1,NoOp(AI escalation)
 same => n,Dial(SIP/AGENT1|SIP/AGENT2,60)
 same => n,Hangup()
