# STT: faster-whisper, Whisper large-v3-turbo с файнтюном kz/ru (8kHz телефонное качество)

model:
  path: /models/whisper/whisper-large-v3-turbo-FT-kzru
  device: cuda
  compute_type: int8_float16       # 4GB VRAM; fallback cpu + int8
  beam_size: 5
  language: null                   # auto-detect (ru/kk), результат уходит в пайплайн
  vad_filter: true                 # Silero-VAD внутри faster-whisper
  condition_on_previous_text: false

audio:
  input_format: s16le
  input_sample_rate: 16000         # media-gateway ресемплингует 8k → 16k
  mono: true

confidence:
  use_word_level: true
  segment_confidence: exp_avg_logprob
  report_no_speech_prob: true
