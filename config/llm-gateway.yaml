# LLM Gateway: прямой вызов API-провайдеров, failover try/except по base_url.
# Без сторонних агрегаторов. API-ключи — из .env, в конфиг не пишутся.

providers:
  - name: qwen-primary
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: LLM_API_KEY_PRIMARY
    model: qwen-max
    timeout_seconds: 15
  - name: qwen-secondary
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key_env: LLM_API_KEY_SECONDARY
    model: qwen-max
    timeout_seconds: 15
  # при смене ядра LLM — добавляем entry в этот же список:
  # - name: qwen3-prod
  #   base_url: https://...
  #   api_key_env: LLM_API_KEY_QWEN3
  #   model: qwen3-...

failover:
  strategy: sequential             # try/except по списку сверху вниз
  health_mark_down_seconds: 60     # при 5xx/таймауте провайдер помечается
  max_consecutive_failures: 3

prompt_cache:
  enabled: true
  cache_system_prompt: true
  cache_rag_block: true            # hash по x_cache_keys от оркестратора
  # реализация зависит от провайдера (cache_control / context cache)

limits:
  max_rpm: 60
  max_tpm: 500000
