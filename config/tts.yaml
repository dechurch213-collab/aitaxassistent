# TTS: Piper (CPU, self-hosted), отдельные голоса под ru и kk
# Формат: voices — словарь voice_id -> (model, config)

voices:
  ru_RU-aidar-medium:
    model: /models/piper/ru_RU-aidar-medium.onnx
    config: /models/piper/ru_RU-aidar-medium.onnx.json
  ru_RU-dmitri-medium:
    model: /models/piper/ru_RU-dmitri-medium.onnx
    config: /models/piper/ru_RU-dmitri-medium.onnx.json
  kk_KZ-astana-medium:
    model: /models/piper/kk_KZ-astana-medium.onnx
    config: /models/piper/kk_KZ-astana-medium.onnx.json
  kk_KZ-almaty-medium:
    model: /models/piper/kk_KZ-almaty-medium.onnx
    config: /models/piper/kk_KZ-almaty-medium.onnx.json

# выбор голоса по языку (оркестратор передаёт lang)
defaults:
  ru: ru_RU-aidar-medium
  kk: kk_KZ-astana-medium

# fallback при ошибке primary (F7)
fallbacks:
  ru: ru_RU-dmitri-medium
  kk: kk_KZ-almaty-medium

settings:
  max_concurrent: 4
